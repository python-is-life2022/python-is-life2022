name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: python-is-life2022
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
